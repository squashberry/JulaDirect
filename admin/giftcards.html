<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>JulaDirect · Gift cards admin</title>
<style>
:root{--ink:#172033;--muted:#687386;--line:#e5eaf1;--blue:#2563eb;--bg:#f5f7fb}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px max(16px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;gap:16px;align-items:center}header a{color:var(--blue);font-weight:700;text-decoration:none}
.wrap{max-width:1180px;margin:22px auto;padding:0 16px}h1{margin:0 0 4px;font-size:26px}p{color:var(--muted);margin:4px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.tabs button{border:0;background:#e9edf7;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;color:#475467}.tabs button[aria-pressed=true]{background:var(--blue);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:var(--muted);font-size:12px;text-transform:uppercase;padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.b{border:0;border-radius:9px;padding:7px 12px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}.b.g{background:#eef1f7;color:var(--ink)}.b.r{background:#fff1f2;color:#be123c}
.pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:#eef1f7;text-transform:capitalize}.ok{background:#e6f8ee;color:#126b3a}.warn{background:#fff6e0;color:#8a5a00}.bad{background:#ffe9ec;color:#be123c}
input,select{font:inherit;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.grid label{display:grid;gap:4px;font-weight:600;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.kpi b{display:block;font-size:24px}.kpi small{color:var(--muted)}
#st{color:var(--muted)}.sw{display:flex;align-items:center;gap:8px;font-weight:600}
</style></head><body><header><strong>JulaDirect · Admin · Gift cards</strong><nav><a href="index.html">Back to control center</a></nav></header>
<main class="wrap"><h1>Gift cards</h1><p>Issued cards, restaurant participation, merchant credits and settlements. Every action here is written to the audit log.</p><div id="st" role="status">Checking administrator access…</div>
<div id="app" hidden><div class="kpis" id="kp"></div><div class="tabs" id="tabs"></div><div id="view"></div></div></main>
<script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/auth-errors.js"></script><script src="../js/auth-guard.js"></script>
<script>
(async function(){"use strict";
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),m=n=>"D"+Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2}),dt=d=>new Date(d).toLocaleString();
await GamBasketAuth.ready();const ses=await GamBasketAuth.getSession(),st=$("#st");if(!ses?.user){st.textContent="Please sign in with an administrator account.";return}
const c=GamBasketAuth.getClient();const {data:adm}=await c.rpc("is_gambasket_admin");if(!adm){st.textContent="Administrator access is required.";return}
st.textContent="";$("#app").hidden=false;
const TABS=[["cards","Cards"],["orders","Physical orders"],["rest","Restaurants"],["set","Settlements"],["ref","Refunds"],["tpl","Designs"],["cfg","Settings"],["audit","Audit log"]];let tab="cards";
const say=r=>{if(!r||r.error||(r.data&&r.data.ok===false)){alert((r&&r.data&&r.data.error)||(r&&r.error&&r.error.message)||"Failed");return false}return true};
const rpc=async(n,a)=>{const r=await c.rpc(n,a);return say(r)};
async function kpis(){const [cd,cr,rd]=await Promise.all([c.from("gift_cards").select("initial_amount,balance,status"),c.from("gift_merchant_credits").select("amount,status"),c.from("gift_ledger").select("id",{count:"exact",head:true})]);
const cs=cd.data||[],cc=cr.data||[],sum=(a,f)=>a.reduce((x,y)=>x+Number(f(y)),0);
$("#kp").innerHTML=[["Cards issued",cs.length],["Total issued",m(sum(cs,x=>x.initial_amount))],["Outstanding balance (liability)",m(sum(cs.filter(x=>["active","partially_redeemed","pending_activation","suspended"].includes(x.status)),x=>x.balance))],["Restaurant credits pending",m(sum(cc.filter(x=>x.status!=="settled"),x=>x.amount))],["Restaurant credits settled",m(sum(cc.filter(x=>x.status==="settled"),x=>x.amount))]].map(([a,b])=>`<div class="kpi"><small>${a}</small><b>${b}</b></div>`).join("")}
const sp=s=>`<span class="pill ${/active|approved|paid|settled|delivered|completed/.test(s)?"ok":/suspend|cancel|fail|reject|reversed/.test(s)?"bad":"warn"}">${esc(String(s).replace(/_/g," "))}</span>`;
async function cards(q){q=(q||"").trim();let r=c.from("gift_cards").select("id,code,program,format,initial_amount,balance,status,purchaser_id,recipient_user_id,created_at").order("created_at",{ascending:false}).limit(100);
if(q){/^[0-9a-f-]{36}$/i.test(q)?r=r.or(`purchaser_id.eq.${q},recipient_user_id.eq.${q},id.eq.${q}`):r=r.ilike("code","%"+q.replace(/[%_]/g,"")+"%")}
const {data}=await r;$("#view").innerHTML=`<div class="card"><div class="row"><input id="q" placeholder="Card number or purchaser/recipient user id" style="flex:1;min-width:240px" value="${esc(q)}"><button class="b" id="go">Search</button></div></div><div class="card"><table><thead><tr><th>Card</th><th>Type</th><th>Balance</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody>${(data||[]).map(x=>`<tr><td><code>${esc(x.code)}</code></td><td>${x.program} · ${x.format}</td><td>${m(x.balance)} / ${m(x.initial_amount)}</td><td>${sp(x.status)}</td><td>${dt(x.created_at)}</td><td><button class="b g" data-open="${x.id}">Open</button></td></tr>`).join("")||"<tr><td colspan=6>No cards</td></tr>"}</tbody></table></div><div id="det"></div>`;
$("#go").onclick=()=>cards($("#q").value);$("#q").onkeydown=e=>{if(e.key==="Enter")cards($("#q").value)};document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>detail(b.dataset.open))}
async function detail(id){const [cd,lg,rd]=await Promise.all([c.from("gift_cards").select("*").eq("id",id).maybeSingle(),c.from("gift_ledger").select("*").eq("card_id",id).order("id",{ascending:false}),c.from("gift_redemptions").select("id,receipt_no,amount,status,created_at,restaurant_id").eq("card_id",id).order("created_at",{ascending:false})]);const k=cd.data;if(!k)return;
$("#det").innerHTML=`<div class="card"><h2 style="margin:0">${esc(k.code)} ${sp(k.status)}</h2><p>Balance ${m(k.balance)} of ${m(k.initial_amount)} · purchaser ${esc(k.purchaser_id)}${k.recipient_user_id?" · recipient "+esc(k.recipient_user_id):""}</p>
<div class="row"><button class="b r" data-act="suspended">Suspend</button><button class="b g" data-act="active">Reactivate</button><button class="b r" data-act="cancelled">Cancel card</button><button class="b r" id="refd">Refund unspent…</button><button class="b" id="adj">Adjust balance…</button></div>
<h3>Ledger (immutable)</h3><table><tbody>${(lg.data||[]).map(l=>`<tr><td>${dt(l.created_at)}</td><td>${l.kind}</td><td><b>${Number(l.amount)<0?"−":"+"}${m(Math.abs(l.amount))}</b></td><td>balance ${m(l.balance_after)}</td><td>${esc(l.note||"")}</td></tr>`).join("")}</tbody></table>
<h3>Redemptions</h3><table><tbody>${(rd.data||[]).map(r=>`<tr><td>${dt(r.created_at)}</td><td>${esc(r.receipt_no)}</td><td>${m(r.amount)}</td><td>${sp(r.status)}</td><td>${r.status==="completed"?`<button class="b r" data-rev="${r.id}">Reverse</button>`:""}</td></tr>`).join("")||"<tr><td>None</td></tr>"}</tbody></table></div>`;
document.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{const why=prompt("Reason (required, recorded in the audit log):");if(!why)return;if(await rpc("gift_admin_set_card_status",{p_card:id,p_status:b.dataset.act,p_reason:why})){kpis();cards($("#q")?.value);detail(id)}});
$("#adj").onclick=async()=>{const d=Number(prompt("Amount to add (positive) or remove (negative), in D:"));if(!d)return;const why=prompt("Reason (at least 10 characters, recorded in the audit log):");if(!why)return;if(await rpc("gift_admin_adjust",{p_card:id,p_delta:d,p_reason:why})){kpis();detail(id)}};
$("#refd").onclick=async()=>{const why=prompt("Why is this card being refunded? (min 5 characters). The card is cancelled and its unspent balance is queued for refund to the buyer.");if(!why)return;if(await rpc("gift_admin_refund_card",{p_card:k.id,p_reason:why})){alert("Refund queued. Send it from the Refunds tab.");kpis();detail(k.id)}};
document.querySelectorAll("[data-rev]").forEach(b=>b.onclick=async()=>{const why=prompt("Reason for reversing this redemption:");if(!why)return;if(await rpc("gift_admin_reverse_redemption",{p_redemption:b.dataset.rev,p_reason:why})){kpis();detail(id)}})}
async function orders(){const {data}=await c.from("gift_orders").select("id,program,format,amount,fee_amount,total,payment_status,fulfilment_status,fulfilment_note,delivery,design,created_at").order("created_at",{ascending:false}).limit(100);
const ph=(data||[]).filter(o=>o.format==="physical");$("#view").innerHTML=`<div class="card"><h2 style="margin-top:0">Physical card orders</h2><table><thead><tr><th>Order</th><th>Card</th><th>Contact</th><th>Payment</th><th>Fulfilment</th></tr></thead><tbody>${ph.map(o=>`<tr><td>${dt(o.created_at)}<br><small>${o.id.slice(0,8)}</small></td><td>${o.program} ${m(o.amount)}<br><small>${esc(o.design.template)} · fees ${m(o.fee_amount)}</small></td><td>${esc(o.delivery.name)}<br>${esc(o.delivery.phone)}<br><small>${o.delivery.method==="delivery"?esc(o.delivery.address):"Collection"}</small></td><td>${sp(o.payment_status)}</td><td>${o.payment_status==="paid"?`<select data-f="${o.id}">${["queued","printing","ready","shipped","delivered","cancelled"].map(s=>`<option ${o.fulfilment_status===s?"selected":""}>${s}</option>`).join("")}</select>`:"—"}</td></tr>`).join("")||"<tr><td colspan=5>No physical orders</td></tr>"}</tbody></table><p>Setting an order to <b>delivered</b> activates the card. Nothing else makes a printed card spendable.</p></div>`;
document.querySelectorAll("[data-f]").forEach(s=>s.onchange=async()=>{const note=s.value==="delivered"||s.value==="shipped"?prompt("Note (optional):")||null:null;if(!(await rpc("gift_admin_set_fulfilment",{p_order:s.dataset.f,p_status:s.value,p_note:note})))orders()})}
async function rest(){const [g,cr,rs,pm]=await Promise.all([c.from("gift_restaurants").select("restaurant_id,status,requested_at"),c.from("gift_merchant_credits").select("restaurant_id,amount,status"),c.from("restaurants").select("id,name"),c.from("gift_payout_methods").select("*")]);const nm=Object.fromEntries((rs.data||[]).map(r=>[r.id,r.name])),pmm=Object.fromEntries((pm.data||[]).map(r=>[r.restaurant_id,r]));
$("#view").innerHTML=`<div class="card"><h2 style="margin-top:0">Participating restaurants</h2><table><thead><tr><th>Restaurant</th><th>Status</th><th>Redeemed</th><th>Pending</th><th>Payout number</th><th></th></tr></thead><tbody>${(g.data||[]).map(x=>{const mine=(cr.data||[]).filter(y=>y.restaurant_id===x.restaurant_id),tot=mine.reduce((a,y)=>a+Number(y.amount),0),pend=mine.filter(y=>y.status==="pending").reduce((a,y)=>a+Number(y.amount),0);return`<tr><td><b>${esc(nm[x.restaurant_id]||x.restaurant_id)}</b></td><td>${sp(x.status)}</td><td>${m(tot)}</td><td>${m(pend)}</td><td>${(()=>{const q=pmm[x.restaurant_id];return q?`${esc(q.network)} ${esc(q.account_number)}<br><small>${esc(q.beneficiary_name)}</small> ${sp(q.status)}${q.status==="pending"?`<br><button class="b g" data-pm="1" data-r="${x.restaurant_id}">Approve</button> <button class="b r" data-pm="0" data-r="${x.restaurant_id}">Reject</button>`:""}`:"<small>none yet</small>"})()}</td><td class="row">${x.status!=="approved"?`<button class="b" data-s="approved" data-r="${x.restaurant_id}">Approve</button>`:`<button class="b r" data-s="suspended" data-r="${x.restaurant_id}">Suspend</button>`}${x.status==="requested"?`<button class="b g" data-s="rejected" data-r="${x.restaurant_id}">Reject</button>`:""}${pend>0?`<button class="b g" data-settle="${x.restaurant_id}">Create settlement</button>`:""}</td></tr>`}).join("")||"<tr><td colspan=6>No restaurants have applied yet</td></tr>"}</tbody></table></div>`;
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{if(await rpc("gift_admin_set_restaurant",{p_restaurant:b.dataset.r,p_status:b.dataset.s}))rest()});
document.querySelectorAll("[data-pm]").forEach(b=>b.onclick=async()=>{if(await rpc("gift_admin_review_payout_method",{p_restaurant:b.dataset.r,p_approve:b.dataset.pm==="1"}))rest()});
document.querySelectorAll("[data-settle]").forEach(b=>b.onclick=async()=>{const ref=prompt("Payment reference (optional):")||null;if(await rpc("gift_admin_create_settlement",{p_restaurant:b.dataset.settle,p_reference:ref})){kpis();rest()}})}
async function sets(){const [s,rs]=await Promise.all([c.from("gift_settlements").select("*").order("created_at",{ascending:false}).limit(100),c.from("restaurants").select("id,name")]);const nm=Object.fromEntries((rs.data||[]).map(r=>[r.id,r.name]));
$("#view").innerHTML=`<div class="card"><h2 style="margin-top:0">Settlements</h2><table><thead><tr><th>Date</th><th>Restaurant</th><th>Total</th><th>Status</th><th>Reference</th><th></th></tr></thead><tbody>${(s.data||[]).map(x=>`<tr><td>${dt(x.created_at)}</td><td>${esc(nm[x.restaurant_id]||"")}</td><td><b>${m(x.total)}</b></td><td>${sp(x.status)}${x.provider_error?`<br><small>${esc(x.provider_error)}</small>`:""}</td><td>${esc(x.reference||"")}</td><td class="row">${x.status==="pending_payment"?`<button class="b g" data-mp="${x.id}">Pay via ModemPay</button><button class="b" data-p="${x.id}">Mark paid</button><button class="b r" data-x="${x.id}">Cancel</button>`:x.status==="processing"?`<button class="b" data-p="${x.id}">Mark paid</button><button class="b r" data-x="${x.id}">Cancel</button>`:""}</td></tr>`).join("")||"<tr><td colspan=6>None</td></tr>"}</tbody></table><p><b>Pay via ModemPay</b> sends the money to the restaurant's approved Wave/Afrimoney number (needs ModemPay payouts switched on). If that is off, or a transfer shows <i>processing</i> and you have confirmed it in ModemPay, use <b>Mark paid</b> with the reference.</p></div>`;
document.querySelectorAll("[data-mp]").forEach(b=>b.onclick=async()=>{if(!confirm("Send this settlement to the restaurant through ModemPay now?"))return;b.disabled=true;const r=await c.functions.invoke("juladirect-giftcard-payout",{body:{settlement_id:b.dataset.mp}});let msg=r.data&&(r.data.message||(r.data.status==="paid"?"Paid.":""));if(!msg&&r.error){try{const j=await r.error.context.json();msg=j.error}catch(e){msg=r.error.message}}alert(msg||"Done.");kpis();sets()});
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{const ref=prompt("Payment reference:")||null;if(await rpc("gift_admin_resolve_settlement",{p_settlement:b.dataset.p,p_paid:true,p_reference:ref})){kpis();sets()}});
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=async()=>{if(confirm("Cancel this settlement? Credits return to pending.")&&await rpc("gift_admin_resolve_settlement",{p_settlement:b.dataset.x,p_paid:false})){kpis();sets()}})}
async function tpl(){const {data}=await c.from("gift_templates").select("*").order("sort");$("#view").innerHTML=`<div class="card"><h2 style="margin-top:0">Designs</h2><table><tbody>${(data||[]).map(t=>`<tr><td><b>${esc(t.name)}</b><br><small>${esc(t.category)}${t.premium?" · premium":""}</small></td><td>${t.slug}</td><td><label class="sw"><input type="checkbox" data-t="${t.slug}" ${t.active?"checked":""}> Available</label></td></tr>`).join("")}</tbody></table></div>`;
document.querySelectorAll("[data-t]").forEach(i=>i.onchange=async()=>{if(!(await rpc("gift_admin_set_template",{p_slug:i.dataset.t,p_active:i.checked})))tpl()})}
async function cfg(){const {data:s}=await c.from("gift_settings").select("*").eq("id",1).maybeSingle();const B=[["enabled","Gift cards on"],["marketplace_enabled","Marketplace cards"],["restaurant_enabled","Restaurant cards"],["virtual_enabled","Virtual format"],["physical_enabled","Physical format"],["collection_enabled","Collection"],["delivery_enabled","Delivery"]],N=[["min_amount","Minimum amount"],["max_amount","Maximum amount"],["physical_fee","Printing fee"],["premium_extra_fee","Premium design extra"],["envelope_fee","Envelope fee"],["delivery_fee","Delivery fee"]];
$("#view").innerHTML=`<div class="card"><h2 style="margin-top:0">Programme settings</h2><div class="grid">${B.map(([k,l])=>`<label class="sw"><input type="checkbox" data-k="${k}" ${s[k]?"checked":""}> ${l}</label>`).join("")}</div><div class="grid" style="margin-top:14px">${N.map(([k,l])=>`<label>${l} (D)<input type="number" min="0" data-n="${k}" value="${s[k]}"></label>`).join("")}<label>Collection note<input data-k2="collection_note" value="${esc(s.collection_note||"")}"></label></div><p>Physical cards stay unavailable until you switch on <b>Physical</b> and at least one of <b>Collection</b> or <b>Delivery</b>, because JulaDirect has no courier integration.</p><button class="b" id="sv">Save settings</button></div>`;
$("#sv").onclick=async()=>{const p={};document.querySelectorAll("[data-k]").forEach(i=>p[i.dataset.k]=i.checked);document.querySelectorAll("[data-n]").forEach(i=>p[i.dataset.n]=Number(i.value));document.querySelectorAll("[data-k2]").forEach(i=>p[i.dataset.k2]=i.value);if(await rpc("gift_admin_update_settings",{p}))alert("Saved")}}
async function audit(){const {data}=await c.from("gift_audit").select("*").order("id",{ascending:false}).limit(150);$("#view").innerHTML=`<div class="card"><h2 style="margin-top:0">Audit log</h2><table><tbody>${(data||[]).map(a=>`<tr><td>${dt(a.created_at)}</td><td><b>${esc(a.action)}</b></td><td>${esc(a.entity_type)} ${esc(a.entity_id||"")}</td><td><small>${esc(JSON.stringify(a.details))}</small></td><td><small>${esc(a.actor_id||"system")}</small></td></tr>`).join("")}</tbody></table></div>`}
async function refs(){const r=await c.from("gift_refunds").select("*").order("created_at",{ascending:false}).limit(100);
$("#view").innerHTML=`<div class="card"><h2 style="margin-top:0">Refunds of unspent gift card value</h2><table><thead><tr><th>Date</th><th>Card</th><th>Amount</th><th>Why</th><th>Status</th><th></th></tr></thead><tbody>${(r.data||[]).map(x=>`<tr><td>${dt(x.created_at)}</td><td><small>${esc(x.card_id)}</small></td><td><b>${m(x.amount)}</b></td><td>${esc(x.reason)}</td><td>${sp(x.status)}${x.error?`<br><small>${esc(x.error)}</small>`:""}${x.reference?`<br><small>${esc(x.reference)}</small>`:""}</td><td class="row">${x.status==="approved"||x.status==="failed"?`<button class="b g" data-rm="${x.id}">Refund via ModemPay</button>`:""}${x.status!=="succeeded"?`<button class="b" data-rman="${x.id}">Mark refunded…</button>`:""}</td></tr>`).join("")||"<tr><td colspan=6>No refunds yet. Start one from a card's page.</td></tr>"}</tbody></table><p>Only the unspent balance is refunded, never the printing or delivery fee. <b>Refund via ModemPay</b> needs ModemPay refunds switched on. Otherwise refund the buyer yourself and use <b>Mark refunded</b> with your reference.</p></div>`;
document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(!confirm("Send this refund to the buyer through ModemPay now?"))return;b.disabled=true;const q=await c.functions.invoke("juladirect-giftcard-refund",{body:{refund_id:b.dataset.rm}});let msg=q.data&&(q.data.message||(q.data.status==="succeeded"?"Refunded.":""));if(!msg&&q.error){try{const j=await q.error.context.json();msg=j.error}catch(e){msg=q.error.message}}alert(msg||"Done.");refs()});
document.querySelectorAll("[data-rman]").forEach(b=>b.onclick=async()=>{const ref=prompt("Your reference for the refund you sent (e.g. Wave transaction id):");if(ref&&await rpc("gift_admin_refund_manual",{p_refund:b.dataset.rman,p_reference:ref}))refs()})}
const V={cards,orders,rest,set:sets,ref:refs,tpl,cfg,audit};
function tabs(){$("#tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" aria-pressed="${tab===k}">${l}</button>`).join("");document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;tabs();V[tab]()})}
tabs();kpis();V[tab]();
})();
</script></body></html>
