<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="js/jd-splash-boot.js"></script>
    <title>Messages - JulaDirect</title>
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/jd.css">
    <link rel="stylesheet" href="css/jd-messages.css?v=8">
</head>
<body class="jd ms-page">
    <div id="jd-header"></div>

    <main id="jd-main" class="ms">
        <div class="ms-shell" id="messagesShell">
            <aside class="ms-list" id="conversationsPane" aria-label="Conversations">
                <header class="ms-list__head"><h1>Messages</h1><span id="unreadTotalBadge" class="ms-count" aria-label="Unread messages">0</span></header>
                <label class="ms-search"><span data-ms-ico="search"></span><input id="conversationSearch" type="search" placeholder="Search conversations" autocomplete="off" aria-label="Search conversations"></label>
                <div id="conversationList" class="ms-rows" aria-live="polite"></div>
            </aside>

            <section class="ms-chat" id="activeChatPane" aria-label="Chat">
                <div id="chatEmpty" class="ms-empty">
                    <div class="ms-empty__in"><div class="ms-empty__logo" data-ms-ico="chat"></div><h2>Your JulaDirect conversations</h2><p>Pick a conversation to chat with a buyer or seller, or tap "Message seller" on any product.</p></div>
                </div>

                <div id="chatActive" class="ms-active" hidden>
                    <header class="ms-bar">
                        <button id="mobileChatBack" class="ms-ib ms-ib--back" type="button" aria-label="Back to conversations" data-jelly></button>
                        <div class="ms-av" id="chatAvatar"></div>
                        <div class="ms-who">
                            <strong id="chatName" class="ms-who__n">JulaDirect Member</strong>
                            <span id="chatStatus" class="ms-who__s">JulaDirect member</span>
                        </div>
                        <div class="ms-bar__acts">
                            <button id="chatOrderIcon" class="ms-ib" type="button" aria-label="Order this product" data-jelly hidden></button>
                            <button id="chatMore" class="ms-ib" type="button" aria-label="More options" aria-haspopup="menu" aria-expanded="false" data-jelly></button>
                        </div>
                    </header>
                    <div id="chatProductContext" class="ms-prod" hidden></div>
                    <div id="realtimeError" class="ms-rt" role="status">Connection lost. <button id="reconnectBtn" type="button">Reconnect</button></div>
                    <div id="messagesArea" class="ms-area"><div class="ms-flow" id="msFlow"></div></div>
                    <button id="newMessagesPill" class="ms-newpill" type="button"></button>
                    <div id="msMenu" class="ms-pop ms-pop--menu" role="menu" hidden></div>
                    <div id="msQuick" class="ms-pop ms-pop--quick" hidden></div>
                    <div id="msEmoji" class="ms-pop ms-pop--emoji" hidden></div>
                    <form id="messageComposer" class="ms-comp" autocomplete="off">
                        <div id="msTray" class="ms-tray" hidden aria-label="Photos to send"></div>
                        <button id="msAttach" class="ms-sq" type="button" aria-label="Add photo" aria-expanded="false" data-jelly></button>
                        <div class="ms-field" id="msField"><textarea id="messageInput" rows="1" maxlength="4000" placeholder="Message" aria-label="Message"></textarea><button id="msEmojiBtn" class="ms-emoji" type="button" aria-label="Emoji" aria-expanded="false" data-jelly></button></div>
                        <div class="ms-rec" id="msRec" hidden role="status"><button id="msRecCancel" class="ms-rec__x" type="button" aria-label="Delete recording"></button><i class="ms-rec__dot"></i><b id="msRecTime">0:00</b><span class="ms-rec__bars" id="msRecBars"></span></div>
                        <button id="sendMessageBtn" class="ms-send" type="submit" aria-label="Record voice message" data-mode="mic" data-jelly></button>
                        <input id="msFilePhoto" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden>
                        <input id="msFileCamera" type="file" accept="image/*" capture="environment" hidden>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <div id="jd-footer"></div>
    <div id="jd-bottomnav"></div>

    <script src="js/jd-jelly.js"></script>
    <script src="js/jd-router.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth-errors.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/jd-core.js"></script>
    <script src="js/jd-data.js"></script>
    <script src="js/messages.js?v=9"></script>
    <script src="js/states.js"></script>
</body>
</html>
